<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple, local 3D exploded assembly viewer." />
    <meta name="theme-color" content="#eeede8" />
    <script>
      var appearance = 'dark', fontChoice = 'modern';
      try {
        appearance = localStorage.getItem('viewer-appearance') || localStorage.getItem('map-appearance') || (localStorage.getItem('viewer-theme') === 'light' ? 'ivory' : 'obsidian');
        fontChoice = localStorage.getItem('viewer-font') || 'modern';
      } catch {}
      appearance = appearance === 'ivory' || appearance === 'light' ? 'light' : 'dark';
      if (!['editorial','modern','technical'].includes(fontChoice)) fontChoice = 'modern';
      document.documentElement.dataset.appearance = appearance;
      document.documentElement.dataset.theme = appearance;
      document.documentElement.dataset.font = fontChoice;
    </script>
    <title>SystemsAnalysisTool</title>
  </head>
  <body>
    <nav class="view-menu" aria-label="Viewer mode">
      <div class="wordmark"><div><strong>System Modelling Tool</strong></div></div>
      <div class="mode-switch"><button id="assembly-mode" type="button" aria-pressed="true">Assembly</button><button id="flyover-mode" type="button" aria-pressed="false">Flyover</button><button id="telemetry-mode" type="button" aria-pressed="false">Telemetry</button><button id="engines-mode" type="button" aria-pressed="false">Engines</button></div>
      <div class="nav-tools"><div data-appearance-host></div></div>
    </nav>
    <main id="assembly-view">
      <header>
        <label class="sr-only" for="model-picker">Choose model</label>
        <select id="model-picker" disabled></select>
        <label class="assembly-file-label" for="assembly-file">Import assembly (.glb, .stl, .step)</label>
        <input id="assembly-file" type="file" accept=".glb,.stl,.stp,.step,model/gltf-binary,model/stl,model/step" disabled>
        <div class="assembly-import-help"><button id="assembly-example" type="button">Example GLB</button></div>
        <p id="assembly-import-status" class="coordinate-note" role="status"></p>
      </header>
<div id="viewport" role="img" aria-label="Interactive SS-27 exterior model. Drag to rotate and scroll to zoom."></div>
      <aside id="component-panel" aria-label="Assembly components">
        <h2>Components</h2>
        <label class="sr-only" for="component-search">Find component</label>
        <input id="component-search" type="search" placeholder="Find component">
        <label class="sr-only" for="component-list">Choose component</label>
        <select id="component-list" size="5"></select>
        <section id="component-detail" aria-live="polite"><h3 id="component-name">Select a component</h3><p id="component-material"></p></section>
        <section id="component-operation" hidden aria-label="Component operating readings">
          <h3>Operating readings</h3><p id="component-data-source" class="component-badge"></p>
          <label id="component-stage-label" for="component-stage">Snapshot</label><select id="component-stage"></select>
          <dl id="component-readings" aria-live="polite"></dl>
        </section>
        <details id="component-cad-properties" hidden><summary>CAD properties</summary><dl id="component-properties"></dl></details>
      </aside>
      <div class="controls control-dock">
        <div class="separation"><label for="separation">PART SEPARATION <output id="separation-value" for="separation">0%</output></label><input id="separation" type="range" min="0" max="100" step="1" value="0" disabled></div>
        
      </div>
      <p id="status" class="sr-only" role="status" aria-live="polite">Preparing model.</p>
      <p id="error" role="alert" hidden></p>
      <noscript>This viewer requires JavaScript to display the model.</noscript>
    </main>
    <section id="flyover-view" hidden aria-label="Earth flyover">
      <div id="globe"></div>
      <aside class="flyover-panel">

        
        <label for="flyover-model">Vehicle</label><select id="flyover-model"></select>
        <label class="notam-toggle"><input id="show-notams" type="checkbox" checked disabled> Show NOTAM areas</label>
        <details><summary>Demo NOTAM areas</summary><p id="notam-status" class="coordinate-note">Loading local areas…</p><div id="notam-list"></div></details>
        <details><summary>Map source</summary>
          <label for="map-source">Source</label>
          <select id="map-source" disabled><option>Loading sources…</option></select>
          <p id="source-network" class="coordinate-note"></p>
          <p id="map-status" class="coordinate-note" role="status"></p>
          <button id="map-retry" hidden type="button">Retry source</button>
          <label for="map-quality">Display quality</label>
          <select id="map-quality"><option value="high">High</option><option value="native">Native</option><option value="balanced">Balanced</option></select>
        </details>
        <details><summary>Saved views</summary>
          <form id="save-map-view"><label for="map-view-name">Name</label><input id="map-view-name" maxlength="48" required placeholder="View name"><button type="submit">Save view</button></form>
          <div id="saved-view-list"></div><p id="saved-view-status" role="status"></p>
        </details>
        <div class="pose-actions"><button id="flight-overview" type="button" disabled>Whole route</button><button id="flight-follow" type="button" aria-pressed="false" disabled>Follow vehicle</button></div>
        <p id="flight-position" class="coordinate-note"></p>
        <details id="state-readout" hidden><summary>State vector readout</summary><p id="flight-state" class="coordinate-note"></p></details>
        <details><summary>Load a flight</summary>
          <label for="flight-dof">Input type</label><select id="flight-dof"><option value="trajectory">Position series</option><option value="3">3DOF — position + velocity</option><option value="6">6DOF — position + velocity + attitude + rates</option></select>
          <div id="state-options" hidden>
            <label for="state-position">Position coordinates</label><select id="state-position"><option value="geodetic">Latitude / longitude / altitude</option><option value="ecef">ECEF X / Y / Z (metres)</option></select>
            <label for="state-velocity">Velocity coordinates (m/s)</label><select id="state-velocity"><option value="enu">East / North / Up</option><option value="ned">North / East / Down</option><option value="ecef">ECEF X / Y / Z</option><option value="body">Body X / Y / Z (6DOF only)</option></select>
            <div id="attitude-options" hidden>
              <label for="state-attitude">Attitude format</label><select id="state-attitude"><option value="euler">Euler roll / pitch / yaw (ZYX)</option><option value="quaternion">Quaternion x / y / z / w</option></select>
              <label for="state-frame">Attitude reference frame</label><select id="state-frame"><option value="enu">Local East / North / Up</option><option value="ned">Local North / East / Down</option><option value="ecef">Earth-fixed (ECEF)</option></select>
              <label for="state-body">Body axes</label><select id="state-body"><option value="flu">Forward / Left / Up</option><option value="frd">Forward / Right / Down</option></select>
              <label for="state-units">Euler angles / body rates</label><select id="state-units"><option value="degrees">Degrees / degrees per second</option><option value="radians">Radians / radians per second</option></select>
            </div>
          </div>
          <p id="flight-format-help" class="coordinate-note">s · degrees · metres (WGS84)</p>
          <code id="flight-header">time,latitude,longitude,altitude</code>
          <label for="flight-csv">Flight CSV</label><textarea id="flight-csv" rows="6" spellcheck="false"></textarea>
          <label for="flight-file">Open CSV file</label><input id="flight-file" type="file" accept=".csv,text/csv">
          
          <div class="pose-actions"><button id="flight-load" type="button" disabled>Load flight</button><button id="flight-example" type="button" disabled>Example</button></div>
        </details>
        <p id="flight-message" role="status"></p>
        
      </aside>
      <div class="flight-controls control-dock">
        <div class="playback-buttons"><button id="flight-play" type="button" disabled>Play</button><button id="flight-restart" type="button" disabled>Restart</button></div>
        <div class="flight-timeline"><label for="flight-time">FLIGHT REPLAY <output id="flight-time-value">0.0 / 60.0 s</output></label><input id="flight-time" type="range" min="0" max="60" step="any" value="0" disabled></div>
        
      </div>
    </section>
    <section id="telemetry-view" aria-label="Telemetry" hidden></section><section id="engines-view" aria-label="Engines" hidden><iframe id="engines-frame" title="Engine dashboard"></iframe></section><script type="module" src="/src/main.ts"></script>
  </body>
</html>
